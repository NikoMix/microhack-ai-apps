version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/src/python"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docs-deps:
        patterns: ["*"]

  - package-ecosystem: "nuget"
    directory: "/src/dotnet"
    schedule:
      interval: "weekly"
    groups:
      dotnet-deps:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/src/mcp-zava"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/slides"
    schedule:
      interval: "weekly"

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"
