# Environment setup for the GitHub Copilot coding agent.
# https://docs.github.com/copilot/customizing-copilot/customizing-the-development-environment-for-copilot-coding-agent
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/copilot-setup-steps.yml"]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Azure Developer CLI (azd)
        run: curl -fsSL https://aka.ms/install-azd.sh | bash
      - name: Install Python tooling
        run: |
          if [ -d src/python ]; then
            cd src/python
            python -m pip install --upgrade pip
            pip install -e ".[dev]" || pip install -r requirements-dev.txt || true
          fi
      - name: Restore .NET
        run: |
          if [ -d src/dotnet ]; then cd src/dotnet && dotnet restore || true; fi
