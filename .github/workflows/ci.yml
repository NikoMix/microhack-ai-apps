name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python track
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check track exists
        id: guard
        run: |
          if [ -d src/python ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v6
        if: steps.guard.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Install + lint + type-check + security + test + audit
        if: steps.guard.outputs.run == 'true'
        working-directory: src/python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          ruff check .
          ruff format --check .
          mypy app
          bandit -c pyproject.toml -r app -q
          pytest -q
          pip-audit

  dotnet:
    name: .NET track
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check track exists
        id: guard
        run: |
          if [ -d src/dotnet ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-dotnet@v6
        if: steps.guard.outputs.run == 'true'
        with:
          dotnet-version: "10.0.x"
      - name: Restore + format + build + test + vuln scan
        if: steps.guard.outputs.run == 'true'
        working-directory: src/dotnet
        run: |
          dotnet restore
          dotnet format --verify-no-changes
          dotnet build --configuration Release --no-restore
          dotnet test --configuration Release --no-build --verbosity normal
          # Fail the job if any vulnerable (incl. transitive) NuGet packages are reported.
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -Eiq "(Critical|High|Moderate|Low)" vuln.txt; then
            echo "::error::Vulnerable NuGet packages detected"; exit 1;
          fi

  docs:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.22.1 "**/*.md" "#**/node_modules" "#**/dist" "#**/obj" "#**/bin" "#**/site" "#**/.venv"
