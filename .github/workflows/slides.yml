name: Slides & Docs

on:
  push:
    branches: ["main"]
    paths: ["slides/**", "docs/**", "mkdocs.yml", ".github/workflows/slides.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install slide tooling (pinned Marp CLI)
        working-directory: slides
        run: npm ci
      - name: Build docs site (MkDocs Material, strict)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt
          mkdocs build --strict -d site
      - name: Build Marp deck into site/slides (HTML required; PDF/PPTX best-effort)
        working-directory: slides
        run: |
          mkdir -p ../site/slides
          for f in *.md; do
            base=$(basename "$f" .md)
            npx marp "$f" -o "../site/slides/$base.html" --html
            npx marp "$f" -o "../site/slides/$base.pdf" --pdf --allow-local-files || true
            npx marp "$f" -o "../site/slides/$base.pptx" --pptx || true
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
