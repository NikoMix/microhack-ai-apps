name: Slides & Docs

on:
  push:
    branches: ["main"]
    paths: ["slides/**", "docs/**", "mkdocs.yml", ".github/workflows/slides.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build Marp decks (HTML + PDF + PPTX)
        run: |
          mkdir -p site/slides
          if [ -d slides ] && ls slides/*.md >/dev/null 2>&1; then
            for f in slides/*.md; do
              base=$(basename "$f" .md)
              npx --yes @marp-team/marp-cli@latest "$f" -o "site/slides/$base.html" --html || true
              npx --yes @marp-team/marp-cli@latest "$f" -o "site/slides/$base.pdf" --pdf --allow-local-files || true
              npx --yes @marp-team/marp-cli@latest "$f" -o "site/slides/$base.pptx" --pptx || true
            done
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build docs site (MkDocs Material)
        run: |
          if [ -f mkdocs.yml ]; then
            pip install mkdocs-material
            mkdocs build -d site --site-dir site || mkdocs build || true
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
